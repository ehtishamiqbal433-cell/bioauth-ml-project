<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zetalyon | Continuous Authentication</title>
    
    <!-- PWA Meta Tags for iOS and Android -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#050a15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zetalyon">
    <link rel="apple-touch-icon" href="https://picsum.photos/192/192">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#050a15',
                            panel: '#0a1128',
                            border: '#1e3a8a',
                            primary: '#06b6d4', // Cyan
                            secondary: '#8b5cf6', // Blue-purple
                            accent: '#10b981', // Teal/Green
                            alert: '#ef4444',
                            text: '#e2e8f0',
                            muted: '#64748b'
                        }
                    },
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    backgroundImage: {
                        'grid-pattern': 'linear-gradient(to right, #1e3a8a 1px, transparent 1px), linear-gradient(to bottom, #1e3a8a 1px, transparent 1px)',
                        'radial-glow': 'radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15), transparent 60%)'
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(6, 182, 212, 0.3)',
                        'neon-alert': '0 0 15px rgba(239, 68, 68, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Allow natural document scrolling */
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #050a15;
            color: #e2e8f0;
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; /* Better mobile tap experience */
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #050a15; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 50;
            position: fixed;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(6,182,212,0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
        }
        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100vh; }
        }

        /* Timeline Playhead Animation */
        @keyframes playhead {
            0% { left: 0%; }
            100% { left: 100%; }
        }
        .animate-playhead {
            animation: playhead 3s linear infinite;
        }
        .animate-playhead-slow {
            animation: playhead 10s linear infinite;
        }

        /* Marquee Animation */
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
        }
    </style>
    </head>
<body class="font-sans antialiased selection:bg-cyber-primary selection:text-cyber-bg">
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // Register Service Worker for PWA (Mobile App Installability)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
<script type="module" src="/index.js"></script></body>
</html>
