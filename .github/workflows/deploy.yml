name: Deploy BQML Model

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - '.github/workflows/deploy-bqml.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  id-token: write # Required for OIDC / Workload Identity Federation
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Environment variables set centrally for easy maintenance
    env:
      GCP_PROJECT_ID: 'meta-coral-456317-g8'
      BQ_LOCATION: 'US'
      SQL_FILE_PATH: 'sql/train_model.sql'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate SQL File Existence
        run: |
          if [ ! -f "$SQL_FILE_PATH" ]; then
            echo "::error::SQL file not found at path: $SQL_FILE_PATH"
            exit 1
          fi

      - name: Execute BQML Training with Exponential Backoff
        run: |
          MAX_ATTEMPTS=5
          RETRY_DELAY=10
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "--- Attempt $attempt of $MAX_ATTEMPTS ---"
            
            # Execute query and append output to log file
            if bq query \
              --use_legacy_sql=false \
              --location="${BQ_LOCATION}" \
              --nouse_cache \
              --project_id="${GCP_PROJECT_ID}" < "$SQL_FILE_PATH" 2>&1 | tee bq_execution.log; then
              
              echo "✓ BQML Training job submitted successfully."
              exit 0
            fi
            
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Query failed (metadata lock/transient error). Waiting ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              # Optional: Double the delay for exponential backoff
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          
          echo "✗ Execution failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bqml-failure-logs
          path: bq_execution.log
