name: Deploy BQML
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/864319996060/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'zta-bioauth-app@meta-coral-456317-g8.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: 'meta-coral-456317-g8'

      - name: Execute BQML Training
        run: |
          MAX_ATTEMPTS=5
          RETRY_DELAY=10
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS..."
            if bq query --use_legacy_sql=false --location=US --nouse_cache < sql/train_model.sql; then
              echo "✓ Query succeeded"
              exit 0
            fi
            
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "⏳ Query failed. Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "✗ Query failed after $MAX_ATTEMPTS attempts"
          exit 1
